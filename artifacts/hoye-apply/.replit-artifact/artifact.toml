kind = "web"
previewPath = "/"
title = "Hoye Secondary School - Apply Online"
version = "1.0.0"
id = "artifacts/hoye-apply"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20771

[services.development]
run = "pnpm --filter @workspace/hoye-apply run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hoye-apply", "run", "build" ]
serve = "static"
publicDir = "artifacts/hoye-apply/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20771"
BASE_PATH = "/"
